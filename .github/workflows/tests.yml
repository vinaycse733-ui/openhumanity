name: Protocol and integration tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -c "import pathlib, subprocess, sys, tempfile; tests = pathlib.Path('tests').resolve(); d = tempfile.TemporaryDirectory(); subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', str(tests), '-v'], cwd=d.name, check=True)"
      - run: openhumanity --help
      - run: openhumanity-web --help
      - run: openhumanity-peer --help
